[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "payload-doctor"
version = "0.1.0"
description = "Explains why a B2B file (X12, EDIFACT, EPCIS 1.2 XML, CSV) failed, in plain English."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hrushika Pendharkar" }]
keywords = ["edi", "x12", "edifact", "epcis", "as2", "b2b", "support", "troubleshooting", "gs1"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "lxml>=5",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
pdoc = "pdoc.cli:app"

[project.urls]
Homepage = "https://github.com/hrushikapendharkar4241-droid/payload-doctor"

[tool.hatch.build.targets.wheel]
packages = ["src/pdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
